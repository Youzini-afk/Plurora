[package]
name = "plurora-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Plurora desktop application"
authors = ["Plurora contributors"]
license = "AGPL-3.0-only"

[lib]
name = "plurora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
plurora-runtime = { path = "../../../crates/plurora-runtime" }
plurora-core = { path = "../../../crates/plurora-core" }

[dev-dependencies]
tempfile = "3"
