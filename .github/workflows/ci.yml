name: ci

on:
  workflow_call:
    inputs:
      release_version:
        description: Optional release tag whose version must match every first-party package.
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract schemas + generated SDKs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Verify first-party license metadata
        run: bash scripts/check-license-metadata.sh

      - name: Verify documentation links and bilingual pairs
        run: python3 scripts/check-docs.py

      - name: Verify Plurora identity invariants
        run: python3 scripts/check-identity.py

      - name: Regenerate schemas and SDKs
        run: bash scripts/regen-sdks.sh

      - name: Validate canonical schemas
        run: bash scripts/validate-schemas.sh

      - name: Verify generated files are committed
        run: test -z "$(git status --porcelain -- docs/spec/v1/schemas sdk)"

      - name: Verify release identity and versions
        if: inputs.release_version != ''
        run: |
          test "$GITHUB_REF" = "refs/tags/${{ inputs.release_version }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/check-release-version.sh "${{ inputs.release_version }}"

      - name: Upload regenerated files when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-contracts-${{ github.sha }}
          path: |
            docs/spec/v1/schemas
            sdk
          retention-days: 3

  rust:
    name: Rust check + test + conformance
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev

      - name: Prepare desktop frontend placeholder
        run: |
          mkdir -p clients/web/dist
          printf '<!doctype html><title>CI placeholder</title>\n' > clients/web/dist/index.html

      - name: cargo check workspace
        run: cargo check --workspace

      - name: cargo test generated Rust SDK
        run: cargo test -p plurora-contract-sdk

      - name: cargo test plurora-runtime
        run: cargo test -p plurora-runtime --lib

      - name: Verified artifact target preview smoke
        run: |
          docker pull nginx:1.27-alpine
          PLURORA_TARGET_DEPLOYMENT_SMOKE=1 cargo test -p plurora-runtime verified_build_context_deploys_on_local_and_agent_targets_smoke -- --ignored --nocapture

      - name: cargo test plurora-service
        run: cargo test -p plurora-service --lib

      - name: cargo test plurora-cli
        run: cargo test -p plurora-cli

      - name: cargo test plurora-core
        run: cargo test -p plurora-core

      - name: cargo test desktop Host supervisor
        run: cargo test -p plurora-desktop --lib

      - name: plurora conformance
        run: cargo run -p plurora-cli --release -- conformance

  host-operations-acceptance:
    name: External project Host operations acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build the public CLI and Host
        run: cargo build --locked -p plurora-cli

      - name: Cache acceptance runtime bases
        run: |
          docker pull nginx:1.27-alpine
          docker pull python:3.13-alpine

      - name: Exercise external development, deployment, recovery, and rollback
        env:
          PLURORA_HOST_OPERATIONS_ACCEPTANCE: "1"
          PLURORA_HOST_OPERATIONS_OUTPUT_DIR: target/host-operations-acceptance
        run: python3 scripts/host-operations-acceptance.py

      - name: Upload Host acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-operations-acceptance-${{ github.sha }}
          path: target/host-operations-acceptance
          retention-days: 3

  host-data-windows:
    name: Windows Host backup + restore
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Exercise private ACL backup and restore
        run: cargo test -p plurora-cli backup_and_restore_preserve_data_and_verify_sqlite

  web:
    name: Web typecheck + test + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            sdk/typescript/contract-sdk/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci --prefix sdk/typescript/contract-sdk

      - name: Test generated TypeScript SDK
        run: npm test --prefix sdk/typescript/contract-sdk

      - name: Install web deps
        run: npm ci --prefix clients/web

      - name: Typecheck
        run: npm run check --prefix clients/web

      - name: Test
        run: npm run test --prefix clients/web

      - name: Build
        run: npm run build --prefix clients/web

  desktop-sidecar:
    name: Desktop managed Host smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install web deps
        run: npm ci --prefix clients/web

      - name: Stage Host sidecar and build client shell
        run: npm run prepare:dev --prefix clients/desktop

      - name: Smoke managed Host sidecar
        run: npm run smoke:sidecar --prefix clients/desktop
