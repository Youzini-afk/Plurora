contributes:
  schemas: []
  hooks: []
  extension_points: []
  surfaces:
    - id: plurora/workspace-lab/forge-panel
      slot: forge_panel
      title: Workspace Lab
      description: Plan, audit, and review workspace actions. Execution, when available, remains a separate Host-controlled ChangeSet workflow.
      capability_id: plurora/workspace-lab/describe_workspace_contract
    - id: plurora/workspace-lab/assistant-action
      slot: assistant_action
      title: Request Workspace Action
      description: Draft a workspace action request with policy/audit/proposal gating. This capability never executes the request.
      capability_id: plurora/workspace-lab/request_workspace_action
      approval_policy: user_approval
    - id: plurora/workspace-lab/home-card
      slot: home_card
      title: Workspace Lab
      description: Deterministic workspace planning with no filesystem or execution authority; approved changes use the separate Host API.
      capability_id: plurora/workspace-lab/describe_workspace_contract
