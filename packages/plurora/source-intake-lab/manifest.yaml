schema_version: 1
id: plurora/source-intake-lab
version: 0.1.0
display_name: Plurora Source Intake Lab
description: Static source intake for external source refs — inspect, classify, detect stack, draft workspace plans, summarize security risks, list candidate entrypoints, and draft adapter plans without clone/install/run/network. Deterministic, no-execution, ordinary package capability with no privileged platform access.
license: AGPL-3.0-only
entry:
