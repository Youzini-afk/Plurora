contributes:
  schemas: []
  hooks: []
  extension_points: []
  surfaces:
    - id: plurora/source-intake-lab/forge-panel
      slot: forge_panel
      title: Source Intake Lab
      description: Inspect external source refs, detect stack, draft workspace plans, summarize risks, list entrypoints, and draft adapter plans.
      capability_id: plurora/source-intake-lab/describe_intake_contract
    - id: plurora/source-intake-lab/assistant-action
      slot: assistant_action
      title: Draft Intake Action
      description: Draft approval-gated workspace plan or adapter plan for an external source.
      capability_id: plurora/source-intake-lab/draft_workspace_plan
      approval_policy: user_approval
    - id: plurora/source-intake-lab/home-card
      slot: home_card
      title: Source Intake Lab
      description: Static source intake without clone, install, run, or network access.
      capability_id: plurora/source-intake-lab/describe_intake_contract
      metadata:
        shell_schema_version: 1
        title:
          en: source intake
          zh-CN: 项目接入
        description:
          en: Inspect an external source reference before clone, install, run, or network access.
          zh-CN: 在 clone、安装、运行或联网前检查外部项目引用。
        icon_hint: folder
        order: 20
    - id: plurora/source-intake-lab/quick-action
      slot: quick_action
      title: Add external source
      description: Draft an intake plan for an external source reference.
      capability_id: plurora/source-intake-lab/draft_workspace_plan
      metadata:
        shell_schema_version: 1
        title:
          en: Add external source
          zh-CN: 添加外部项目
        description:
          en: Draft an intake plan before execution.
          zh-CN: 在执行前生成接入计划。
        icon_hint: plus
        order: 30
permissions:
  capabilities:
