  - id: plurora/composition-lab/launch_plan
    version: 0.1.0
    input_schema: {}
    output_schema: {}
    streaming: false
    side_effects: []
  - id: plurora/composition-lab/permission_preview
    version: 0.1.0
    input_schema: {}
    output_schema: {}
    streaming: false
    side_effects: []
  - id: plurora/composition-lab/surface_graph
    version: 0.1.0
    input_schema: {}
    output_schema: {}
    streaming: false
    side_effects: []
  - id: plurora/composition-lab/compat_report
    version: 0.1.0
    input_schema: {}
    output_schema: {}
    streaming: false
    side_effects: []
consumes: []
contributes:
  schemas: []
  hooks: []
  extension_points: []
  surfaces:
    - id: plurora/composition-lab/home-card
      slot: home_card
      title: Composition Lab
      description: Validate package composition, preview launch plans, and inspect surface wiring.
      capability_id: plurora/composition-lab/describe
    - id: plurora/composition-lab/forge-panel
      slot: forge_panel
      title: Composition Graph
      description: Inspect composition packages, required surfaces, permissions, and launch graph.
      capability_id: plurora/composition-lab/surface_graph
    - id: plurora/composition-lab/assistant-action
      slot: assistant_action
      title: Explain Composition
      description: Draft an approval-gated explanation or launch checklist for a composition.
      capability_id: plurora/composition-lab/launch_plan
      approval_policy: user_approval
    - id: plurora/composition-lab/workshop-card
      slot: workshop_card
      title: Composition Check
      description: Validate package composition and inspect surface wiring.
      capability_id: plurora/composition-lab/validate
      metadata:
        shell_schema_version: 1
        title:
          en: Composition check
          zh-CN: 组合检查
        description:
          en: Validate package composition and inspect surface wiring.
          zh-CN: 检查包组合与 surface wiring。
        icon_hint: stack
        order: 40
        category: tool
permissions:
  capabilities:
    invoke: []
sandbox_policy:
  cpu_quota_ms_per_invoke: 5000
  memory_mb: 128
  wall_clock_ms: 30000
