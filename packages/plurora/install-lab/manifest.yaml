schema_version: 1
id: plurora/install-lab
version: 0.1.0
display_name: Install Lab
description: Resolves source into verifiable Work and AssemblyLock installation candidates.
license: AGPL-3.0-only
entry:
  kind: rust_inproc
  crate_ref: plurora-install-lab
  contract: v1
  symbol: plurora_install_lab
  abi_version: 1
provides:
  - id: plurora/install-lab/detect_source
    version: 1.0.0
    input_schema: {}
    output_schema: {}
    side_effects:
      - filesystem.read
      - filesystem.write
      - network.read
    streaming: false
  - id: plurora/install-lab/resolve_plan
    version: 1.0.0
    input_schema: {}
    output_schema: {}
    side_effects:
      - filesystem.read
      - filesystem.write
      - network.read
    streaming: false
  - id: plurora/install-lab/execute_plan
    version: 1.0.0
    input_schema: {}
    output_schema: {}
    side_effects:
      - filesystem.read
      - filesystem.write
      - network.read
    streaming: false
  - id: plurora/install-lab/prepare_external_intake
    version: 1.0.0
    input_schema:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
        root_ref:
          type: string
        data_dir:
          type: string
        linked_local:
          type: boolean
    output_schema: {}
    side_effects:
      - filesystem.read
      - filesystem.write
      - network.read
    streaming: false
requires:
  - id: plurora/git-tools-lab
    source:
      kind: internal
    version: ">=0.1.0"
  - id: plurora/integrity-lab
    source:
      kind: internal
    version: ">=0.1.0"
consumes: []
contributes:
  schemas: []
  hooks: []
  extension_points: []
  surfaces: []
permissions:
  capabilities:
    invoke:
      - plurora/git-tools-lab/*
      - plurora/integrity-lab/*
  network:
    declarations:
      - host: github.com
        methods: [GET, POST]
        purpose: resolve and fetch explicitly requested source revisions
      - host: gitlab.com
        methods: [GET, POST]
        purpose: resolve and fetch explicitly requested source revisions
      - host: codeberg.org
        methods: [GET, POST]
        purpose: resolve and fetch explicitly requested source revisions
      - host: bitbucket.org
        methods: [GET, POST]
        purpose: resolve and fetch explicitly requested source revisions
  filesystem:
    read:
      - /tmp/plurora-git/
      - ~/.plurora/objects/
      - ~/.plurora/workspaces/
      - ~/.plurora/cache/
    write:
      - /tmp/plurora-git/
      - ~/.plurora/objects/
      - ~/.plurora/workspaces/
      - ~/.plurora/cache/
sandbox_policy:
  cpu_quota_ms_per_invoke: 30000
  memory_mb: 512
  wall_clock_ms: 120000
