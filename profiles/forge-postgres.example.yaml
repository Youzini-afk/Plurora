title: Forge Alpha (PostgreSQL event store example)

# Host-only event store selection. The environment variable must contain the
# private PostgreSQL connection string; the value must not be written to package
# manifests, events, proposals, logs, or public diagnostics.
event_store:
  kind: postgres
  env: PLURORA_POSTGRES_DATABASE_URL

autoload:
