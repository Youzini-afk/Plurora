    OutboundAuditRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: |-
        Generic outbound audit record / envelope.

        Records an outbound network request made by a package through Plurora-provided network/request helpers. This is a platform event payload — it does NOT contain raw secrets, bodies, headers, prompts, or responses. Only `secret_ref` identifiers and the `redaction_state` are recorded.
      properties:
        capability_id:
          description: Capability through which the request was made.
          type: string
        cost:
          default: null
          description: Cost placeholder.
        destination_host:
          description: Destination host.
          type: string
        error:
          default: null
          description: Error message if status is not "allowed".
          type:
          - string
          - 'null'
        id:
          description: Unique record id.
          type: string
        method:
          description: HTTP method (GET, POST, etc).
          type: string
        package_id:
          description: Package that owns the outbound request.
          type: string
        principal:
          description: The principal that initiated the request.
          type: string
        purpose:
          default: null
          description: Declared purpose from the manifest or request context.
          type:
          - string
          - 'null'
        receipt:
          anyOf:
          - $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              annotations:
                additionalProperties: true
                default: {}
                type: object
              artifact_type_uri:
                type: string
              digest:
                type: string
              media_type:
                type: string
              references:
                default: []
                items:
                  type: string
                type: array
              size_bytes:
                format: uint64
                minimum: 0.0
                type: integer
            required:
            - artifact_type_uri
            - digest
            - media_type
            - size_bytes
            title: ArtifactDescriptor
            type: object
          - type: 'null'
          default: null
        redaction_state:
          allOf:
          - $ref: '#/components/schemas/RedactionState'
          default: not_captured
          description: Redaction state — what data, if any, was recorded.
        secret_refs_used:
          default: []
          description: Secret references used (not raw secrets).
          items:
            type: string
          type: array
        status:
          description: 'Request status: "allowed", "denied", "error", etc.'
          type: string
        usage:
          default: null
          description: Usage placeholder (e.g. token count).
      required:
      - capability_id
      - destination_host
      - id
      - method
      - package_id
      - principal
      - status
      title: OutboundAuditRecord
      type: object
