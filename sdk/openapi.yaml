components:
  schemas:
    AccessMode:
      enum:
      - read_only
      - read_write
      - append_only
      type: string
    AcquisitionKind:
      enum:
      - work_bundle
      - package
      - git_snapshot
      - local_import
      - remote_catalog
      - foreign_binding
      type: string
    AcquisitionRecord:
      properties:
        kind:
          $ref: '#/components/schemas/AcquisitionKind'
        provenance_refs:
          items:
            $ref: '#/components/schemas/ArtifactDescriptor'
          type: array
        source_ref:
          anyOf:
          - $ref: '#/components/schemas/ArtifactDescriptor'
          - type: 'null'
        update_channel:
          type:
          - string
          - 'null'
      required:
      - kind
      type: object
    ActiveBindingRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        binding_id:
          $ref: '#/components/schemas/BindingId'
        consumer_installation_id:
          $ref: '#/components/schemas/InstallationId'
        consumer_port:
          $ref: '#/components/schemas/PortId'
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        exposure_id:
          $ref: '#/components/schemas/ExposureId'
        transport:
          $ref: '#/components/schemas/SelectedTransport'
      required:
      - binding_id
      - consumer_installation_id
      - consumer_port
      - exposure_id
      - transport
      title: ActiveBindingRecord
      type: object
    AppendEventRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        kind:
          type: string
        metadata: true
        payload: true
        session_id:
          type: string
        writer_package_id:
          type: string
      required:
      - kind
      - metadata
      - payload
      - session_id
      - writer_package_id
      title: AppendEventRequest
      type: object
    ArtifactDescriptor:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        annotations:
          additionalProperties: true
          default: {}
          type: object
        artifact_type_uri:
          type: string
        digest:
          type: string
        media_type:
          type: string
        references:
          default: []
          items:
            type: string
          type: array
        size_bytes:
          format: uint64
          minimum: 0.0
          type: integer
      required:
      - artifact_type_uri
      - digest
      - media_type
      - size_bytes
      title: ArtifactDescriptor
      type: object
    AssemblyBinding:
      properties:
        annotations:
          additionalProperties: true
          type: object
        binding_id:
          type: string
        consumer:
          $ref: '#/components/schemas/PortEndpoint'
        phase:
          $ref: '#/components/schemas/BindingPhase'
        provider:
          $ref: '#/components/schemas/PortEndpoint'
        transport_policy:
          allOf:
          - $ref: '#/components/schemas/TransportPolicy'
          default:
            requirements:
              large_payload: false
              local_only: false
              ordered: false
              reliable: false
              same_process: false
              shared_memory_allowed: false
      required:
      - binding_id
      - consumer
      - phase
      - provider
      type: object
    AssemblyId:
      pattern: ^(?!.*\.\.)[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)+$
      type: string
    AssemblyLock:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        assembly:
          $ref: '#/components/schemas/ArtifactDescriptor'
        bindings:
          items:
            $ref: '#/components/schemas/BindingLock'
          type: array
        content_roots:
          items:
            $ref: '#/components/schemas/ArtifactDescriptor'
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/NodeLock'
          type: array
        protocol_profiles:
          items:
            $ref: '#/components/schemas/ProtocolProfilePin'
          type: array
        schema:
          const: plurora.assembly-lock.v1
          type: string
      required:
      - assembly
      - nodes
      - schema
      title: AssemblyLock
      type: object
    AssemblyNode:
      properties:
        annotations:
          additionalProperties: true
          type: object
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ArtifactDescriptor'
          - type: 'null'
        node_id:
          $ref: '#/components/schemas/NodeId'
        ports:
          items:
            $ref: '#/components/schemas/PortDescriptor'
          type: array
        source:
          $ref: '#/components/schemas/AssemblyNodeSource'
      required:
      - node_id
      - source
      type: object
    AssemblyNodeSource:
      oneOf:
      - properties:
          component:
            $ref: '#/components/schemas/ArtifactDescriptor'
          kind:
            enum:
            - component
            type: string
        required:
        - component
        - kind
        type: object
      - properties:
          assembly:
            $ref: '#/components/schemas/ArtifactDescriptor'
          kind:
            enum:
            - assembly
            type: string
        required:
        - assembly
        - kind
        type: object
    AssemblyPortExposure:
      properties:
        annotations:
          additionalProperties: true
          type: object
        direction:
          $ref: '#/components/schemas/PortDirection'
        port_id:
          $ref: '#/components/schemas/PortId'
        target:
          $ref: '#/components/schemas/PortEndpoint'
      required:
      - direction
      - port_id
      - target
      type: object
    AssemblyRevision:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        annotations:
          additionalProperties: true
          type: object
        assembly_id:
          $ref: '#/components/schemas/AssemblyId'
        bindings:
          items:
            $ref: '#/components/schemas/AssemblyBinding'
          type: array
        exposed_ports:
          items:
            $ref: '#/components/schemas/AssemblyPortExposure'
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/AssemblyNode'
          type: array
        schema:
          const: plurora.assembly-revision.v1
          type: string
        state_slots:
          items:
            $ref: '#/components/schemas/StateSlotDescriptor'
          type: array
      required:
      - assembly_id
      - nodes
      - schema
      title: AssemblyRevision
      type: object
    AssetContentEncoding:
      description: Encoding used by the public `object.put` and `object.get` content field.
      enum:
      - utf8
      - hex
      type: string
    AssetGetParams:
      additionalProperties: false
      description: Original ordinary-Asset selector for `object.get`.
      properties:
        asset_id:
          type: string
      required:
      - asset_id
      type: object
    AssetGetResponse:
      additionalProperties: false
      description: Original ordinary-Asset result for `object.get`.
      properties:
        content:
          type: string
        record:
          $ref: '#/components/schemas/AssetRecord'
      required:
      - content
      - record
      type: object
    AssetPermissions:
      properties:
        read:
          default: false
          type: boolean
        write:
          default: false
          type: boolean
      type: object
    AssetPutRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      properties:
        artifact:
          anyOf:
          - $ref: '#/components/schemas/ExactArtifactUpload'
          - type: 'null'
        content:
          type: string
        metadata:
          default: null
        mime:
          type: string
        origin_package_id:
          default: null
          type:
          - string
          - 'null'
      required:
      - content
      - mime
      title: AssetPutRequest
      type: object
    AssetRecord:
      properties:
        created_at:
          format: date-time
          type: string
        descriptor:
          anyOf:
          - $ref: '#/components/schemas/ArtifactDescriptor'
          - type: 'null'
        hash:
          type: string
        id:
          type: string
        metadata:
          default: null
        mime:
          type: string
        origin_package_id:
          type: string
        size_bytes:
          format: uint64
          minimum: 0.0
          type: integer
      required:
      - created_at
      - hash
      - id
      - mime
      - origin_package_id
      - size_bytes
      type: object
    AuditPackageParams:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        package_id:
          type: string
        since:
          format: date-time
          type:
          - string
          - 'null'
        until:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - package_id
      title: AuditPackageParams
      type: object
    AuthorityDecisionListResult:
      items:
        $schema: https://json-schema.org/draft/2020-12/schema
        properties:
          id:
            type: string
          kind:
            type: string
          metadata:
            default: null
          payload: true
          schema_version:
            format: uint16
            minimum: 0.0
            type: integer
          sequence:
            format: uint64
            minimum: 0.0
            type: integer
          session_id:
            type: string
          timestamp:
            format: date-time
            type: string
          writer_package_id:
            type: string
        required:
        - id
        - kind
        - payload
        - schema_version
        - sequence
        - session_id
        - timestamp
        - writer_package_id
        title: EventEnvelope
        type: object
      type: array
    AuthorityDeniedPayload:
      properties:
        operation:
          type: string
        package_id:
          type: string
      type: object
    AuthorityGrantListResult:
      items:
        $schema: https://json-schema.org/draft/2020-12/schema
        properties:
          granted_at:
            format: date-time
            type: string
          id:
            type: string
          permission:
            type: string
          principal:
            $ref: '#/components/schemas/ProtocolPrincipal'
          reason:
            default: null
            type:
            - string
            - 'null'
          revoked_at:
            default: null
            format: date-time
            type:
            - string
            - 'null'
          scope:
            default: null
            type:
            - string
            - 'null'
        required:
        - granted_at
        - id
        - permission
        - principal
        title: PermissionGrantRecord
        type: object
      type: array
    AuthorityHandleRevokeResult:
      type: object
    AvailabilityPolicy:
      enum:
      - required
      - degraded_without
      - optional
      type: string
    BackupPolicy:
      enum:
      - required
      - allowed
      - forbidden
      type: string
    BindingCandidate:
      additionalProperties: false
      properties:
        availability:
          $ref: '#/components/schemas/AvailabilityPolicy'
        candidate_digest:
          description: Digest of every canonical field below, including verified descriptive disclosure. Selection uses this digest, never an order-sensitive digest of the whole candidate set. Sorting ignores descriptive and publisher fields, but any disclosure drift still makes a prior decision stale.
          type: string
        capability:
          $ref: '#/components/schemas/CapabilityPin'
        consumer:
          $ref: '#/components/schemas/BindingEndpointPin'
        consumer_port:
          $ref: '#/components/schemas/PortDescriptor'
        effective_expires_at:
          format: date-time
          type:
          - string
          - 'null'
        exposure:
          $ref: '#/components/schemas/ExposureView'
        phase:
          $ref: '#/components/schemas/BindingPhase'
        provider:
          $ref: '#/components/schemas/BindingEndpointPin'
        provider_component:
          $ref: '#/components/schemas/BindingComponentDisclosure'
        provider_installation:
          $ref: '#/components/schemas/BindingInstallationDisclosure'
        provider_port:
          $ref: '#/components/schemas/PortDescriptor'
        provider_work:
          $ref: '#/components/schemas/BindingWorkDisclosure'
        transport:
          $ref: '#/components/schemas/SelectedTransport'
      required:
      - availability
      - candidate_digest
      - capability
      - consumer
      - consumer_port
      - exposure
      - phase
      - provider
      - provider_component
      - provider_installation
      - provider_port
      - provider_work
      - transport
      type: object
    BindingCandidatesRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      properties:
        consumer_installation_id:
          $ref: '#/components/schemas/InstallationId'
        consumer_run:
          anyOf:
          - $ref: '#/components/schemas/RunRevisionPin'
          - type: 'null'
        expected_consumer_installation_revision:
          format: uint64
          minimum: 0.0
          type: integer
        import_port:
          $ref: '#/components/schemas/PortId'
        phase:
          $ref: '#/components/schemas/BindingPhase'
        preferences:
          description: An ordering hint only. It never selects a candidate or grants authority.
          items:
            $ref: '#/components/schemas/ResourceSelector'
          type: array
      required:
      - consumer_installation_id
      - expected_consumer_installation_revision
      - import_port
      - phase
      title: BindingCandidatesRequest
      type: object
    BindingCandidatesResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/BindingCandidate'
          type: array
        gaps:
          items:
            $ref: '#/components/schemas/BindingGap'
          type: array
      required:
      - candidates
      title: BindingCandidatesResult
      type: object
    BindingComponentDisclosure:
      additionalProperties: false
      description: Host-verified Component identity and evidence. This is deliberately narrower than ComponentDescriptor so annotations, surfaces, and content roots cannot become an accidental disclosure channel.
      properties:
        behavior:
          $ref: '#/components/schemas/ArtifactDescriptor'
        claim_status:
          $ref: '#/components/schemas/ComponentClaimStatus'
        component_artifact:
          $ref: '#/components/schemas/ArtifactDescriptor'
        component_id:
          type: string
        enforced_boundaries:
          $ref: '#/components/schemas/ComponentBoundaryClaims'
        entry_kind:
          type: string
        package_id:
          type: string
        protocol_implementations:
          items:
            $ref: '#/components/schemas/PackagedProtocolDescriptor'
          type: array
        trust_class:
          $ref: '#/components/schemas/ComponentTrustClass'
        version:
          type: string
      required:
      - behavior
      - claim_status
      - component_artifact
      - component_id
      - enforced_boundaries
      - entry_kind
      - package_id
      - trust_class
      - version
      type: object
    BindingDecisionStatus:
      enum:
      - selected
      - revoked
      - expired
      type: string
    BindingEffectiveStatus:
      oneOf:
      - properties:
          kind:
            enum:
            - detached
            type: string
        required:
        - kind
        type: object
      - properties:
          kind:
            enum:
            - active
            type: string
        required:
        - kind
        type: object
      - properties:
          kind:
            enum:
            - broken
            type: string
          reason_code:
            type: string
        required:
        - kind
        - reason_code
        type: object
    BindingEndpointPin:
      additionalProperties: false
      properties:
        component:
          $ref: '#/components/schemas/ComponentPin'
        installation:
          $ref: '#/components/schemas/InstallationRevisionPin'
        port:
          $ref: '#/components/schemas/ResolvedPortPin'
        run:
          anyOf:
          - $ref: '#/components/schemas/RunRevisionPin'
          - type: 'null'
      required:
      - component
      - installation
      - port
      type: object
    BindingGap:
      additionalProperties: false
      properties:
        installation_id:
          anyOf:
          - $ref: '#/components/schemas/InstallationId'
          - type: 'null'
        interaction_model:
          type:
          - string
          - 'null'
        next_step:
          type: string
        node_id:
          anyOf:
          - $ref: '#/components/schemas/NodeId'
          - type: 'null'
        port_id:
          anyOf:
          - $ref: '#/components/schemas/PortId'
          - type: 'null'
        reason_code:
          type: string
        run_id:
          anyOf:
          - $ref: '#/components/schemas/RunId'
          - type: 'null'
      required:
      - next_step
      - reason_code
      type: object
    BindingId:
      format: uuid
      type: string
    BindingInstallationDisclosure:
      additionalProperties: false
      description: Verified, public Installation origin shown before a Binding decision. It intentionally excludes state bindings, secret policy, and host-local paths.
      properties:
        display_name:
          type: string
        installation_id:
          $ref: '#/components/schemas/InstallationId'
        installation_revision:
          format: uint64
          minimum: 0.0
          type: integer
        source:
          $ref: '#/components/schemas/AcquisitionRecord'
      required:
      - display_name
      - installation_id
      - installation_revision
      - source
      type: object
    BindingLifecyclePayloadSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        binding:
          $ref: '#/components/schemas/BindingView'
      required:
      - binding
      title: BindingLifecyclePayloadSchema
      type: object
    BindingListRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      properties:
        consumer_installation_id:
          anyOf:
          - $ref: '#/components/schemas/InstallationId'
          - type: 'null'
        run_id:
          anyOf:
          - $ref: '#/components/schemas/RunId'
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/BindingDecisionStatus'
          - type: 'null'
      title: BindingListRequest
      type: object
    BindingLock:
      properties:
        binding_id:
          type: string
        consumer:
          $ref: '#/components/schemas/PortEndpoint'
        phase:
          $ref: '#/components/schemas/BindingPhase'
        provider:
          $ref: '#/components/schemas/PortEndpoint'
        provider_component:
          $ref: '#/components/schemas/ArtifactDescriptor'
        transport:
          $ref: '#/components/schemas/SelectedTransport'
      required:
      - binding_id
      - consumer
      - phase
      - provider
      - provider_component
      - transport
      type: object
    BindingMutationResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        affected_binding_ids:
          items:
            $ref: '#/components/schemas/BindingId'
          type: array
        binding:
          $ref: '#/components/schemas/BindingView'
        idempotent:
          type: boolean
      required:
      - binding
      - idempotent
      title: BindingMutationResult
      type: object
    BindingPhase:
      enum:
      - authoring
      - installation
      - launch
      - runtime
      type: string
    BindingRevokeRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      properties:
        binding_id:
          $ref: '#/components/schemas/BindingId'
        consumer_installation_id:
          $ref: '#/components/schemas/InstallationId'
        consumer_run:
          anyOf:
          - $ref: '#/components/schemas/RunRevisionPin'
          - type: 'null'
        expected_binding_revision:
          format: uint64
          minimum: 0.0
          type: integer
        expected_consumer_installation_revision:
          format: uint64
          minimum: 0.0
          type: integer
        exposure_id:
          $ref: '#/components/schemas/ExposureId'
        idempotency_key:
          type: string
        import_port:
          $ref: '#/components/schemas/PortId'
      required:
      - binding_id
      - consumer_installation_id
      - expected_binding_revision
      - expected_consumer_installation_revision
      - exposure_id
      - idempotency_key
      - import_port
      title: BindingRevokeRequest
      type: object
    BindingSelectRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      properties:
        candidate_digest:
          type: string
        consumer_installation_id:
          $ref: '#/components/schemas/InstallationId'
        consumer_run:
          anyOf:
          - $ref: '#/components/schemas/RunRevisionPin'
          - type: 'null'
        expected_consumer_installation_revision:
          format: uint64
          minimum: 0.0
          type: integer
        expected_exposure_revision:
          format: uint64
          minimum: 0.0
          type: integer
        expected_provider_installation_revision:
          format: uint64
          minimum: 0.0
          type: integer
        exposure_id:
          $ref: '#/components/schemas/ExposureId'
        idempotency_key:
          type: string
        import_port:
          $ref: '#/components/schemas/PortId'
        phase:
          $ref: '#/components/schemas/BindingPhase'
        provider_installation_id:
          $ref: '#/components/schemas/InstallationId'
      required:
      - candidate_digest
      - consumer_installation_id
      - expected_consumer_installation_revision
      - expected_exposure_revision
      - expected_provider_installation_revision
      - exposure_id
      - idempotency_key
      - import_port
      - phase
      - provider_installation_id
      title: BindingSelectRequest
      type: object
    BindingSelectionRecord:
      additionalProperties: false
      properties:
        availability:
          $ref: '#/components/schemas/AvailabilityPolicy'
        binding_id:
          $ref: '#/components/schemas/BindingId'
        candidate_digest:
          type: string
        capability:
          $ref: '#/components/schemas/CapabilityPin'
        consumer:
          $ref: '#/components/schemas/BindingEndpointPin'
        effective_expires_at:
          format: date-time
          type:
          - string
          - 'null'
        exposure_id:
          $ref: '#/components/schemas/ExposureId'
        exposure_revision:
          format: uint64
          minimum: 0.0
          type: integer
        phase:
          $ref: '#/components/schemas/BindingPhase'
        provider:
          $ref: '#/components/schemas/BindingEndpointPin'
        status:
          $ref: '#/components/schemas/BindingDecisionStatus'
        transport:
          $ref: '#/components/schemas/SelectedTransport'
      required:
      - availability
      - binding_id
      - candidate_digest
      - capability
      - consumer
      - exposure_id
      - exposure_revision
      - phase
      - provider
      - status
      - transport
      type: object
    BindingView:
      properties:
        effective_status:
          $ref: '#/components/schemas/BindingEffectiveStatus'
        record:
          $ref: '#/components/schemas/BindingSelectionRecord'
        revision:
          format: uint64
          minimum: 0.0
          type: integer
      required:
      - effective_status
      - record
      - revision
      type: object
    BindingWorkDisclosure:
      additionalProperties: false
      description: Verified, public Work identity shown before a Binding decision. Descriptive text is disclosure, never preference or execution authority.
      properties:
        title:
          type: string
        work_id:
          $ref: '#/components/schemas/WorkId'
      required:
      - title
      - work_id
      type: object
    BranchRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        child_session_id:
          type: string
        created_at:
          format: date-time
          type: string
        forked_from_sequence:
          format: uint64
          minimum: 0.0
          type: integer
        id:
          type: string
        metadata:
          default: null
        parent_session_id:
          type: string
      required:
      - child_session_id
      - created_at
      - forked_from_sequence
      - id
      - parent_session_id
      title: BranchRecord
      type: object
    BuildAction:
      properties:
        action_id:
          type: string
        builder_id:
          type: string
        input_refs:
          items:
            $ref: '#/components/schemas/ArtifactDescriptor'
          type: array
        node_id:
          $ref: '#/components/schemas/NodeId'
        output_id:
          type: string
        parameter_ref:
          $ref: '#/components/schemas/ArtifactDescriptor'
      required:
      - action_id
      - builder_id
      - node_id
      - output_id
      - parameter_ref
      type: object
    CapAttenuateParams:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        constraints: true
        parent_handle:
          $ref: '#/components/schemas/CapHandleId'
      required:
      - constraints
      - parent_handle
      title: CapAttenuateParams
      type: object
    CapHandle:
      properties:
        cap_type:
          type: string
        cap_version:
          type: string
        constraints: true
        id:
          $ref: '#/components/schemas/CapHandleId'
        lease:
          $ref: '#/components/schemas/HandleLease'
        parent:
          anyOf:
          - $ref: '#/components/schemas/CapHandleId'
          - type: 'null'
        provenance:
          $ref: '#/components/schemas/HandleProvenance'
        revoked:
          type: boolean
        scope:
          $ref: '#/components/schemas/HandleScope'
      required:
      - cap_type
      - cap_version
      - constraints
      - id
      - lease
      - provenance
      - revoked
      - scope
      type: object
    CapHandleId:
      format: uint128
      type: string
    CapHandleResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        handle:
          $ref: '#/components/schemas/CapHandle'
      required:
      - handle
